# ─────────────────────────────────────────────────────────────────────────────
# TalkOps MCP Server — PyPI & GitHub Release Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Trigger: Push a tag like  prometheus-mcp-server/v0.2.0
# Result:  Validate → Test → Build → Publish to PyPI → Scoped GitHub Release
# ─────────────────────────────────────────────────────────────────────────────

name: "📦 Release to PyPI"

on:
  push:
    tags:
      # Matches per-server monorepo tags like: prometheus-mcp-server/v0.2.0
      - "*/v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release (e.g., prometheus-mcp-server/v0.2.0)"
        required: true
        type: string

# Cancel in-flight runs for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # GitHub Releases
  id-token: write        # PyPI Trusted Publishers (OIDC)

jobs:
  # ── Step 1: Parse the tag and validate ──────────────────────────────────
  meta:
    name: "🏷️ Parse Release Tag"
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.parse.outputs.tag_name }}
      server_name: ${{ steps.parse.outputs.server_name }}
      version: ${{ steps.parse.outputs.version }}
      server_dir: ${{ steps.parse.outputs.server_dir }}
      pypi_name: ${{ steps.parse.outputs.pypi_name }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Tag format: <server-name>/v<version>
          SERVER_NAME="${TAG%/v*}"
          VERSION="${TAG#*/v}"

          IS_PRERELEASE="false"
          if echo "$VERSION" | grep -qE '(-|alpha|beta|rc|dev)'; then
            IS_PRERELEASE="true"
          fi

          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "server_name=${SERVER_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "server_dir=src/${SERVER_NAME}" >> "$GITHUB_OUTPUT"
          echo "pypi_name=talkops-${SERVER_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

          echo "📦 Server:     ${SERVER_NAME}"
          echo "🏷️  Version:    ${VERSION} (prerelease=${IS_PRERELEASE})"
          echo "📁 Directory:  src/${SERVER_NAME}"
          echo "🐍 PyPI name:  talkops-${SERVER_NAME}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.parse.outputs.tag_name }}

      - name: Validate version matches pyproject.toml
        run: |
          TOML_VERSION=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "${{ steps.parse.outputs.server_dir }}/pyproject.toml")
          TAG_VERSION="${{ steps.parse.outputs.version }}"
          if [ "$TOML_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch! pyproject.toml=${TOML_VERSION} tag=${TAG_VERSION}"
            exit 1
          fi
          echo "✅ Version match: ${TAG_VERSION}"

  # ── Step 2: Run tests ──────────────────────────────────────────────────
  test:
    name: "🧪 Test"
    needs: meta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.meta.outputs.server_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: |
          if [ "${{ needs.meta.outputs.server_name }}" = "helm-mcp-server" ]; then
            echo "⚠️  Skipping full integration tests for helm-mcp-server; running plugin & skill contract tests"
            uv run pytest tests/unit/test_plugin_and_skills.py -v --tb=short
            exit 0
          fi
          if [ -d "tests" ] && [ "$(find tests -name 'test_*.py' -o -name '*_test.py' | head -1)" ]; then
            uv run pytest tests/ -v --tb=short
          else
            echo "⚠️  No tests found — skipping"
          fi

  # ── Step 3: Build sdist + wheel + live capability metadata ─────────────
  build:
    name: "🔨 Build"
    needs: [meta, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ needs.meta.outputs.server_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          rm -rf dist/ release-meta/
          uv build

      - name: Verify built artifacts & generate SHA256SUMS.txt
        run: |
          echo "📦 Built artifacts:"
          ls -lh dist/
          VERSION="${{ needs.meta.outputs.version }}"
          if ! ls dist/*${VERSION}* 1>/dev/null 2>&1; then
            echo "❌ No artifacts found with version ${VERSION}"
            exit 1
          fi
          mkdir -p release-meta
          (cd dist && sha256sum *.whl *.tar.gz > ../release-meta/SHA256SUMS.txt)
          cat release-meta/SHA256SUMS.txt

      - name: Introspect live MCP server capabilities
        run: |
          uv sync --no-dev
          uv run python - << 'PYEOF' > release-meta/metadata.json
          import asyncio, json, logging, os, sys
          from importlib import import_module
          from pathlib import Path
          from fastmcp import Client

          logging.disable(logging.CRITICAL)
          srv_dir = Path(".").resolve()
          sys.path.insert(0, str(srv_dir))
          pkg = srv_dir.name.replace("-", "_")

          for k, v in {
              "MCP_ALLOW_WRITE": "true",
              "AM_READ_ONLY": "false",
              "MCP_READ_ONLY": "false",
              "MCP_TOOLSETS": "all",
              "AM_TOOLSETS": "all",
              "PROMETHEUS_TOOLSETS": "all",
              "LOKI_TOOLSETS": "all",
              "ARGOCD_AUTH_TOKEN": "placeholder",
              "ARGOCD_SERVER_URL": "https://localhost:8080",
              "KARGO_TOKEN": "placeholder",
          }.items():
              os.environ[k] = v

          async def introspect():
              mcp = None
              for mod_name in (f"{pkg}.server.bootstrap", f"{pkg}.server", f"{pkg}.main"):
                  try:
                      mod = import_module(mod_name)
                  except Exception:
                      continue
                  if hasattr(mod, "ServerBootstrap"):
                      sb = mod.ServerBootstrap
                      for mname in ("initialize", "create_server", "bootstrap"):
                          if hasattr(sb, mname):
                              res = getattr(sb, mname)()
                              mcp = res[0] if isinstance(res, tuple) else res
                              break
                  for fn in ("create_mcp_server", "bootstrap_server", "create_server", "build_server"):
                      if mcp is None and hasattr(mod, fn):
                          res = getattr(mod, fn)()
                          mcp = res[0] if isinstance(res, tuple) else res
                          break
                  if mcp is not None:
                      break

              tool_count = 0
              resource_count = 0
              if mcp is not None:
                  async with Client(mcp) as client:
                      tool_count = len(await client.list_tools())
                      resource_count = len(await client.list_resources()) + len(await client.list_resource_templates())

              skills_dir = srv_dir / "skills"
              skills = (
                  sorted(p.name for p in skills_dir.iterdir() if p.is_dir() and (p / "SKILL.md").is_file())
                  if skills_dir.is_dir()
                  else []
              )
              print(json.dumps({"tool_count": tool_count, "resource_count": resource_count, "skills": skills}))

          asyncio.run(introspect())
          PYEOF
          cat release-meta/metadata.json

      - name: Upload PyPI build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.meta.outputs.server_name }}
          path: ${{ needs.meta.outputs.server_dir }}/dist/
          retention-days: 5

      - name: Upload release metadata & checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-meta-${{ needs.meta.outputs.server_name }}
          path: ${{ needs.meta.outputs.server_dir }}/release-meta/
          retention-days: 5

  # ── Step 4: Publish to PyPI ────────────────────────────────────────────
  publish-pypi:
    name: "🚀 Publish to PyPI"
    needs: [meta, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.meta.outputs.pypi_name }}/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.meta.outputs.server_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          print-hash: true

  # ── Step 5: Create Scoped GitHub Release ───────────────────────────────
  github-release:
    name: "📋 GitHub Release"
    needs: [meta, build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.meta.outputs.server_name }}
          path: dist/

      - name: Download release metadata & checksums
        uses: actions/download-artifact@v4
        with:
          name: release-meta-${{ needs.meta.outputs.server_name }}
          path: release-meta/

      - name: Generate scoped release notes
        run: |
          python3 scripts/generate_release_notes.py \
            --repo-root . \
            --server-name "${{ needs.meta.outputs.server_name }}" \
            --version "${{ needs.meta.outputs.version }}" \
            --pypi-name "${{ needs.meta.outputs.pypi_name }}" \
            --github-repo "${{ github.repository }}" \
            --dist-dir dist \
            --meta-file release-meta/metadata.json \
            --tag-name "${{ needs.meta.outputs.tag_name }}" \
            --end-ref "${{ github.sha }}" \
            --output /tmp/release_body.md

          echo "✅ Generated GitHub Release notes:"
          cat /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag_name }}
          name: "${{ needs.meta.outputs.server_name }} v${{ needs.meta.outputs.version }}"
          body_path: /tmp/release_body.md
          files: |
            dist/*
            release-meta/SHA256SUMS.txt
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
